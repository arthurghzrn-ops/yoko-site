<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Arial', sans-serif; margin: 0; padding: 0; text-align: center; }
        header { padding: 100px 20px; background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%); }
        h1 { font-size: 3.5rem; margin: 0; color: #ffffff; letter-spacing: 4px; }
        p.slogan { font-style: italic; color: #ff4e4e; font-size: 1.5rem; margin-top: 10px; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .menu-item { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 20px; margin: 15px 0; border-radius: 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .menu-text { max-width: 70%; }
        .menu-title { font-size: 1.3rem; color: #ffffff; margin: 0 0 5px 0; }
        .menu-desc { font-size: 0.9rem; color: #aaaaaa; margin: 0; }
        .menu-price { font-size: 1.4rem; color: #ff4e4e; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>YOKO</h1>
        <p style="color: #888; letter-spacing: 2px; margin: 0;">ASIAN LOFT & KITCHEN</p>
        <p class="slogan">{{ slogan }}</p>
    </header>

    <div class="container">
        <h2 style="color: #ffffff; border-bottom: 2px solid #ff4e4e; padding-bottom: 10px; text-align: left;">МЕНЮ</h2>
        {% for item in menu %}
        <div class="menu-item">
            <div class="menu-text">
                <p class="menu-title">{{ item.name }}</p>
                <p class="menu-desc">{{ item.desc }}</p>
            </div>
            <div class="menu-price">{{ item.price }}</div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
