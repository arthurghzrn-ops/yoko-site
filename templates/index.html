<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YOKO | Asian Loft & Kitchen</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow-x: hidden; font-family: 'Playfair Display', serif; color: white; }
        
        /* Видео на фоне */
        .video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
        }

        /* Затемнение, чтобы текст был виден */
        .overlay { background: rgba(0, 0, 0, 0.6); min-height: 100vh; padding-bottom: 50px; }

        .header { text-align: center; padding: 40px 0; }
        .logo { width: 200px; margin-bottom: 10px; }
        .nav-links a { margin: 0 15px; color: #c5a059; text-decoration: none; font-weight: bold; text-transform: uppercase; }

        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 30px 0; }
        .cat-btn { padding: 10px 25px; border: 1px solid #c5a059; background: rgba(0,0,0,0.3); color: #c5a059; cursor: pointer; border-radius: 50px; transition: 0.3s; }
        .cat-btn.active { background: #c5a059; color: #fff; }

        .menu-section { display: none; max-width: 500px; margin: 0 auto; text-align: center; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; }
        .menu-section.active { display: block; animation: fadeIn 0.8s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .item { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
        .item-price { color: #c5a059; font-weight: bold; }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline class="video-bg">
        <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4">
    </video>

    <div class="overlay">
        <div class="header">
            <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">
            <div class="nav-links">
                <a href="https://www.instagram.com/yoko.asianloft/">Instagram</a>
                <a href="https://t.me/yoko_loft_kitchen_bot">Telegram</a>
            </div>
        </div>

        <div class="categories">
            {% for category in menu.keys() %}
            <button class="cat-btn" onclick="showCat('{{ category }}')" id="btn-{{ category }}">{{ category }}</button>
            {% endfor %}
        </div>

        {% for category, items in menu.items() %}
        <div class="menu-section" id="cat-{{ category }}">
            <h2 style="color: #c5a059;">{{ category }}</h2>
            {% for item in items %}
            <div class="item">
                <span>{{ item.name }}</span>
                <span class="item-price">{{ item.price }}</span>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>

    <script>
        function showCat(cat) {
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
            document.getElementById('btn-' + cat).classList.add('active');
        }
        window.onload = () => { document.querySelector('.cat-btn').click(); };
    </script>
</body>
</html>
