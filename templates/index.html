<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOKO | Asian Loft & Kitchen</title>
    <style>
        :root { --gold: #c5a059; --bg: #ffffff; --text: #1a1a1a; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Helvetica', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 40px 20px; }
        .logo { width: 150px; margin-bottom: 20px; }
        .nav-links { margin-bottom: 30px; }
        .nav-links a { margin: 0 10px; color: var(--gold); text-decoration: none; font-weight: bold; }
        
        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 20px; }
        .cat-btn { padding: 10px 20px; border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; border-radius: 20px; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.active { background: var(--gold); color: white; }
        
        .menu-section { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .menu-section.active { display: block; }
        .item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item-name { font-weight: bold; }
        .item-desc { font-size: 0.8rem; color: #666; margin-top: 4px; }
        .item-price { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.ibb.co/3sX8h2D/logo.jpg" class="logo"> <div class="nav-links">
            <a href="https://www.instagram.com/yoko.asianloft/">Instagram</a>
            <a href="https://t.me/yoko_loft_kitchen_bot">Telegram</a>
            <a href="tel:+37493535454">Контакты</a>
        </div>
    </div>

    <div class="categories" id="catNav">
        {% for category in menu.keys() %}
        <button class="cat-btn" onclick="showCat('{{ category }}')">{{ category }}</button>
        {% endfor %}
    </div>

    {% for category, items in menu.items() %}
    <div class="menu-section" id="cat-{{ category }}">
        {% for item in items %}
        <div class="item">
            <div>
                <div class="item-name">{{ item.name }}</div>
                <div class="item-desc">{{ item.desc }}</div>
            </div>
            <div class="item-price">{{ item.price }}</div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

    <script>
        function showCat(cat) {
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
