<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOKO | Asian Loft & Kitchen</title>
    <style>
        :root { --gold: #c5a059; --bg: #ffffff; --text: #1a1a1a; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 40px 20px; }
        .logo { width: 150px; margin-bottom: 15px; }
        .nav-links { margin-bottom: 25px; }
        .nav-links a { margin: 0 10px; color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 10px; margin-bottom: 30px; }
        .cat-btn { padding: 8px 16px; border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; border-radius: 20px; transition: 0.3s; font-size: 0.85rem; }
        .cat-btn.active { background: var(--gold); color: white; }
        .menu-section { display: none; padding: 0 20px; max-width: 600px; margin: 0 auto; }
        .menu-section.active { display: block; }
        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .item-name { font-weight: bold; }
        .item-desc { font-size: 0.75rem; color: #777; margin-top: 3px; }
        .item-price { color: var(--gold); font-weight: bold; padding-left: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">
        <div class="nav-links">
            <a href="https://www.instagram.com/yoko.asianloft/">INSTAGRAM</a>
            <a href="https://t.me/yoko_loft_kitchen_bot">TELEGRAM</a>
            <a href="tel:+37493535454">КОНТАКТЫ</a>
        </div>
    </div>

    <div class="categories" id="catNav">
        {% for category in menu.keys() %}
        <button class="cat-btn" onclick="showCat(this, 'cat-{{ loop.index }}')">{{ category }}</button>
        {% endfor %}
    </div>

    {% for category, items in menu.items() %}
    <div class="menu-section" id="cat-{{ loop.index }}">
        {% for item in items %}
        <div class="item">
            <div>
                <div class="item-name">{{ item.name }}</div>
                <div class="item-desc">{{ item.desc }}</div>
            </div>
            <div class="item-price">{{ item.price }}</div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

    <script>
        function showCat(btn, id) {
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
