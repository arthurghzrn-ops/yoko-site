<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YOKO | Asian Loft & Kitchen</title>
    <style>
        /* Глубокий премиальный фон вместо серого */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background: #1a1714; /* Темно-шоколадный цвет */
            color: #ffffff; 
        }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        /* Шапка с логотипом */
        .hero { text-align: center; margin-bottom: 60px; }
        .logo { width: 220px; margin-bottom: 25px; }
        h1 { font-size: 2.8rem; color: #c5a059; margin: 0; letter-spacing: 2px; }
        .slogan { font-size: 1.2rem; color: #d4c19c; margin-top: 10px; font-style: italic; }

        /* Блок навигации */
        .nav-links { margin-bottom: 50px; }
        .nav-links a { color: #c5a059; text-decoration: none; font-weight: bold; margin: 0 15px; text-transform: uppercase; font-size: 0.9rem; }

        /* Стильные кнопки категорий */
        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 40px; }
        .cat-btn { padding: 12px 24px; border: 1px solid #c5a059; background: transparent; color: #c5a059; cursor: pointer; border-radius: 4px; transition: 0.4s; text-transform: uppercase; font-weight: bold; }
        .cat-btn:hover, .cat-btn.active { background: #c5a059; color: #fff; }

        /* Меню без рамок */
        .menu-section { display: none; margin-bottom: 50px; }
        .menu-section.active { display: block; }
        .item { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #332f2b; }
        .item-name { font-size: 1.1rem; }
        .item-price { color: #c5a059; font-weight: bold; font-size: 1.1rem; }

        /* Футер */
        .footer { text-align: center; border-top: 2px solid #c5a059; padding-top: 40px; margin-top: 50px; color: #888; }
        .footer p { margin: 5px 0; }
    </style>
</head>
<body>

    <div class="container">
        <section class="hero">
            <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">
            <h1>YOKO</h1>
            <p class="slogan">Два мира. Одно меню. Идеальный вкус.</p>
        </section>

        <div class="nav-links" style="text-align: center;">
            <a href="https://www.instagram.com/yoko.asianloft/">Instagram</a>
            <a href="https://t.me/yoko_loft_kitchen_bot">Telegram</a>
        </div>

        <div class="categories">
            {% for category in menu.keys() %}
            <button class="cat-btn" onclick="showCat('{{ category }}')" id="btn-{{ category }}">{{ category }}</button>
            {% endfor %}
        </div>

        {% for category, items in menu.items() %}
        <div class="menu-section" id="cat-{{ category }}">
            {% for item in items %}
            <div class="item">
                <span class="item-name">{{ item.name }}</span>
                <span class="item-price">{{ item.price }}</span>
            </div>
            {% endfor %}
        </div>
        {% endfor %}

        <footer class="footer">
            <p>г. Гюмри, ул. Дживани 68</p>
            <p>+374 93 53 54 54</p>
        </footer>
    </div>

    <script>
        function showCat(cat) {
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
            document.getElementById('btn-' + cat).classList.add('active');
        }
        window.onload = () => { const first = document.querySelector('.cat-btn'); if(first) first.click(); };
    </script>
</body>
</html>
