<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YOKO | Asian Loft & Kitchen</title>
    <style>
        /* Темно-песочный цвет фона */
        :root { 
            --gold: #c5a059; 
            --bg: #2d261e; 
            --text: #ffffff; 
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Helvetica', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 40px 20px; }
        
        /* Исправленный путь к логотипу */
        .logo { width: 300px; margin-bottom: 20px; border-radius: 10px; }
        
        .nav-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; }

        /* Контакты - теперь открываются как блок */
        #contact-block { display: none; padding: 20px; text-align: center; border: 1px solid var(--gold); margin: 20px; }

        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
        .cat-btn { padding: 10px 20px; border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; border-radius: 20px; }
        .cat-btn.active { background: var(--gold); color: #fff; }
        
        .menu-section { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .menu-section.active { display: block; }
        .item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #4a4035; }
        .item-price { color: var(--gold); }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">
        <div class="nav-links">
            <a href="https://www.instagram.com/yoko.asianloft/">Instagram</a>
            <a href="https://t.me/yoko_loft_kitchen_bot">Telegram</a>
            <a href="#" onclick="document.getElementById('contact-block').style.display='block'; return false;">Контакты</a>
        </div>
    </div>

    <div id="contact-block">
        <h3>Наши контакты</h3>
        <p>г. Гюмри, ул. Дживани 68</p>
        <p>Тел: +374 93 53 54 54</p>
        <button onclick="document.getElementById('contact-block').style.display='none'">Закрыть</button>
    </div>

    <div class="categories">
        {% for category in menu.keys() %}
        <button class="cat-btn" onclick="showCat('{{ category }}')">{{ category }}</button>
        {% endfor %}
    </div>

    {% for category, items in menu.items() %}
    <div class="menu-section" id="cat-{{ category }}">
        {% for item in items %}
        <div class="item">
            <div>{{ item.name }}<br><small>{{ item.desc }}</small></div>
            <div class="item-price">{{ item.price }}</div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

    <script>
        function showCat(cat) {
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
        }
    </script>
</body>
</html>
